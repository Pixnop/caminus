name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  VS_VERSION: "1.22.7"

jobs:
  build:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache game files
        id: vs-cache
        uses: actions/cache@v4
        with:
          path: ~/vintagestory
          key: vintagestory-server-${{ env.VS_VERSION }}

      - name: Download Vintage Story server ${{ env.VS_VERSION }}
        if: steps.vs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/vintagestory
          curl -sSL --proto '=https' "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz" | tar xz -C ~/vintagestory
          ls ~/vintagestory/VintagestoryAPI.dll ~/vintagestory/Mods/VSEssentials.dll

      - name: Sonar begin
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"Pixnop_caminus" /o:"leon-fievet-pixnop" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="src/Caminus/**,tests/**,docs/**,tools/**"

      - name: Build
        env:
          VINTAGE_STORY: /home/runner/vintagestory
        run: dotnet build -c Release

      - name: Test
        env:
          VINTAGE_STORY: /home/runner/vintagestory
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Sonar end
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - uses: actions/upload-artifact@v4
        with:
          name: caminus-zip
          path: dist/*.zip
